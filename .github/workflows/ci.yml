name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write # julia-actions/cache prunes the caches it created
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # the declared compat floor and the current stable release
        version: ['1.12', '1']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Test suites of every sub-environment
        run: julia --color=yes test.jl
      - name: Standalone script smoke tests
        run: |
          julia --color=yes run.jl sysinfo
          julia --color=yes run.jl workspace-audit --dirty-only
      - name: Dispatcher smoke test (CPU only, reduced sampling)
        run: >
          julia --color=yes run.jl hardware-diagnostics
          --cpu-only --sizes 256 --types Float32,Int32
          --min-time 0.05 --max-samples 3 --no-log
          --out-dir "$RUNNER_TEMP/hardware-diagnostics"
