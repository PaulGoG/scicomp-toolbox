name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Cache Julia Artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate Sub-Environments
        run: |
          julia --project=hardware-diagnostics -e '
            using Pkg
            Pkg.instantiate()
          '

      - name: Run Global Test Suite
        run: |
          julia test.jl

      - name: Run Standalone Sysinfo Smoke Test
        run: |
          julia standalone/sysinfo.jl

      - name: Run Executable Smoke Test via Dispatcher
        run: |
          julia run.jl hardware-diagnostics --quick --cpu-only --no-log
