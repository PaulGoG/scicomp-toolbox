version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "julia"
    directories:
      - "/hardware-diagnostics"
      - "/hardware-diagnostics/test"
      - "/formatter"
      - "/plot-benchmarks"
      - "/run-index"
      - "/slurm-launch"
      - "/standalone"
    schedule:
      interval: "weekly"
    ignore:
      # KernelAbstractions 0.10 moves the CPU backend to PoCL; adopting it is a
      # deliberate migration, not a version bump
      - dependency-name: "KernelAbstractions"
        update-types: ["version-update:semver-minor"]
