version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "julia"
    directories:
      - "/hardware-diagnostics"
      - "/hardware-diagnostics/test"
      - "/formatter"
      - "/plot-benchmarks"
      - "/run-index"
      - "/slurm-launch"
      - "/convergence"
      - "/convergence/test"
      - "/figure-audit"
      - "/bib-hygiene"
      - "/launch-check"
      - "/standalone"
    schedule:
      interval: "weekly"
    groups:
      # one pull request for the compatible updates of the week instead of one per package
      julia-minor-and-patch:
        patterns: ["*"]
        # a formatter update can change the formatting and gets a pull request of its own
        exclude-patterns: ["JuliaFormatter"]
        update-types: ["minor", "patch"]
    ignore:
      # KernelAbstractions 0.10 moves the CPU backend to PoCL and needs a migration; the
      # GPU packages are held to the series that accept KernelAbstractions 0.9.
      - dependency-name: "KernelAbstractions"
      - dependency-name: "CUDA"
      - dependency-name: "AMDGPU"
      - dependency-name: "oneAPI"
      - dependency-name: "Metal"
