version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "julia"
    directories:
      - "/hardware-diagnostics"
      - "/hardware-diagnostics/test"
      - "/formatter"
      - "/plot-benchmarks"
      - "/run-index"
      - "/slurm-launch"
      - "/convergence"
      - "/convergence/test"
      - "/figure-audit"
      - "/bib-hygiene"
      - "/standalone"
    schedule:
      interval: "weekly"
    ignore:
      # KernelAbstractions 0.10 moves the CPU backend to PoCL; adopting it is a
      # deliberate migration, not a version bump. The GPU packages are bounded to
      # the series that still accept KernelAbstractions 0.9 for the same reason.
      - dependency-name: "KernelAbstractions"
      - dependency-name: "CUDA"
      - dependency-name: "AMDGPU"
      - dependency-name: "oneAPI"
      - dependency-name: "Metal"
